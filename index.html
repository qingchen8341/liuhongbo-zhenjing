<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F1F0EB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121315" media="(prefers-color-scheme: dark)">
<title>雅思真经听读</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="真经听读">

<style>
@font-face { font-family: 'Gentium Book Plus'; font-weight: 400; font-style: normal; font-display: swap; src: url('./GentiumBookPlus-Regular.woff2') format('woff2'); }
@font-face { font-family: 'Gentium Book Plus'; font-weight: 700; font-style: normal; font-display: swap; src: url('./GentiumBookPlus-Bold.woff2') format('woff2'); }
@font-face { font-family: 'Gentium Book Plus'; font-weight: 400; font-style: italic; font-display: swap; src: url('./GentiumBookPlus-Italic.woff2') format('woff2'); }
@font-face { font-family: 'Barlow Condensed'; font-weight: 600; font-style: normal; font-display: swap; src: url('./BarlowCondensed-SemiBold.woff2') format('woff2'); }
@font-face { font-family: 'Barlow Condensed'; font-weight: 700; font-style: normal; font-display: swap; src: url('./BarlowCondensed-Bold.woff2') format('woff2'); }
@font-face { font-family: 'Barlow Condensed'; font-weight: 700; font-style: italic; font-display: swap; src: url('./BarlowCondensed-BoldItalic.woff2') format('woff2'); }
@font-face { font-family: 'Barlow Condensed'; font-weight: 800; font-style: italic; font-display: swap; src: url('./BarlowCondensed-ExtraBoldItalic.woff2') format('woff2'); }
</style>
<style>
:root {
  /* One study column. Orange (the book's cover colour) is reserved for sound and progress. */
  --bg: #F1F0EB;
  --surface: #FFFFFF;
  --ink: #17181C;
  --muted: #6C6B66;
  --line: #E2E0D8;
  --accent: #E8590C;
  --accent-ink: #FFFFFF;
  --tint: #FCEADD;
  --good: #1B8452;
  --good-tint: #E2F2E9;
  --bad: #BF3A2B;
  --bad-tint: #F8E3DF;
  --f-display: "Barlow Condensed", "PingFang SC", "Hiragino Sans GB", sans-serif;
  --f-word: "Gentium Book Plus", "Iowan Old Style", "Times New Roman", serif;
  --f-body: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  --r: 14px;
  --accent-2: #9A4A12;
  --screen-r: 0px;
  --inset: 16px;
  --card-r: 26px;
  /* safe areas: the page is drawn under the host's bars (viewport-fit=cover) */
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121315; --surface: #1C1D20; --ink: #ECEBE6; --muted: #9C9B95; --line: #2C2D31;
    --accent: #FF7A2F; --accent-ink: #1A0E05; --tint: #3A2416;
    --good: #4CC487; --good-tint: #16301F; --bad: #F07A6A; --bad-tint: #3A1C18;
    --accent-2: #F2B07A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121315; --surface: #1C1D20; --ink: #ECEBE6; --muted: #9C9B95; --line: #2C2D31;
  --accent: #FF7A2F; --accent-ink: #1A0E05; --tint: #3A2416;
  --good: #4CC487; --good-tint: #16301F; --bad: #F07A6A; --bad-tint: #3A1C18;
  --accent-2: #F2B07A;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.55; -webkit-text-size-adjust: 100%; }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
img { max-width: 100%; }

.wrap { max-width: 620px; margin: 0 auto; padding: calc(18px + var(--sat)) 16px calc(96px + var(--sab)); display: flex; flex-direction: column; gap: 18px; }
.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.brand { font-family: var(--f-display); font-weight: 800; font-style: italic; font-size: 30px; letter-spacing: .5px; line-height: 1; }
.brand b { color: var(--accent); }
.sync { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.sync i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); display: inline-block; }
.sync.on i { background: var(--good); }

.daybar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; }
.stat .n { font-family: var(--f-display); font-weight: 700; font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums; }
.stat .l { font-size: 12px; color: var(--muted); }

.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.sec-h h2 { font-size: 15px; font-weight: 600; color: var(--muted); letter-spacing: .5px; }
.sec-h .hint { font-size: 12px; color: var(--muted); }

.task { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; }
.task.done { opacity: .62; }
.unum { font-family: var(--f-display); font-style: italic; font-weight: 800; font-size: 26px; line-height: 1; min-width: 46px; text-align: center; color: var(--ink); }
.task .t1 { font-weight: 600; }
.task .t2 { font-size: 13px; color: var(--muted); }
.chip { display: inline-block; font-size: 11.5px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.chip.warn { border-color: var(--bad); color: var(--bad); }
.chip.ok { border-color: var(--good); color: var(--good); }
.chip.acc { border-color: var(--accent); color: var(--accent); }

.btn { border: 0; border-radius: 12px; padding: 10px 16px; background: var(--ink); color: var(--bg); font-weight: 600; cursor: pointer; white-space: nowrap; }
.btn.acc { background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn.small { padding: 6px 12px; font-size: 14px; border-radius: 10px; }
.btn.block { width: 100%; padding: 14px; font-size: 17px; }
.btn:disabled { opacity: .4; cursor: default; }
.link { background: none; border: 0; color: var(--accent); cursor: pointer; padding: 4px 0; font-weight: 600; }

.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: var(--r); padding: 18px; color: var(--muted); font-size: 14px; }

/* nav */
.nav { position: fixed; left: 0; right: 0; bottom: 0; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--line); padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); display: flex; justify-content: center; z-index: 5; }
.nav[hidden] { display: none; }
.nav-in { display: grid; grid-template-columns: repeat(4, 1fr); max-width: 620px; width: 100%; }
.nav a { text-decoration: none; color: var(--muted); font-size: 12px; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; border-radius: 10px; }
.nav a .g { font-family: var(--f-display); font-weight: 700; font-size: 19px; line-height: 1; }
.nav a.on { color: var(--ink); }
.nav a.on .g { color: var(--accent); }

/* unit list */
.chap { display: flex; flex-direction: column; gap: 8px; }
.chap h3 { font-size: 14px; color: var(--muted); font-weight: 600; display: flex; gap: 8px; align-items: baseline; }
.chap h3 span { font-family: var(--f-display); font-style: italic; font-weight: 800; font-size: 18px; color: var(--ink); }
.urow { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; cursor: pointer; text-align: left; width: 100%; }
.bar { height: 6px; background: var(--line); border-radius: 999px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
.stages { display: flex; gap: 4px; }
.stages i { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--line); display: inline-block; }
.stages i.d { background: var(--good); border-color: var(--good); }
.stages i.due { border-color: var(--accent); }

/* overlay session */
.ov { position: fixed; inset: 0; background: var(--bg); z-index: 10; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.ov-in { max-width: 620px; margin: 0 auto; padding: 0 16px 40px; display: flex; flex-direction: column; gap: 16px; min-height: 100%; }
/* session header: one continuous band from under the host's bar down to the progress row */
.ov-top { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; position: sticky; top: 0; background: var(--bg); margin: 0 -16px; padding: calc(10px + var(--sat)) 16px 10px; z-index: 4; }
.ov-top::after { content: ""; position: absolute; left: 0; right: 0; top: 100%; height: 16px; background: linear-gradient(var(--bg), color-mix(in srgb, var(--bg) 0%, transparent)); pointer-events: none; }
.ov-top .x { width: 36px; height: 36px; display: inline-flex; align-items: center; justify-content: center; margin-left: -6px; border-radius: 50%; }
.ov-top .prog { height: 8px; }
.x { border: 0; background: none; font-size: 26px; line-height: 1; cursor: pointer; color: var(--muted); padding: 4px 6px; }
.prog { height: 10px; background: var(--line); border-radius: 999px; overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width .3s; }
.count { font-family: var(--f-display); font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; color: var(--muted); }
.phase { font-size: 13px; color: var(--muted); letter-spacing: 1px; }

/* word card */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.hw-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.hw { font-family: var(--f-word); font-weight: 700; font-size: 38px; line-height: 1.1; letter-spacing: -.3px; word-break: break-word; }
.ipa { font-family: var(--f-word); font-size: 19px; color: var(--muted); }
.mean { font-size: 17px; font-weight: 600; }
.mean .pos { font-family: var(--f-word); font-style: italic; font-weight: 400; color: var(--accent); margin-right: 2px; }
.illus { background: var(--surface); border-radius: 12px; border: 1px solid var(--line); padding: 8px; display: flex; justify-content: center; }
.illus img { max-height: 220px; object-fit: contain; }
:root[data-theme="dark"] .illus img { filter: invert(.88) hue-rotate(180deg); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .illus img { filter: invert(.88) hue-rotate(180deg); } }
.blk { display: grid; grid-template-columns: 26px 1fr; gap: 6px; font-size: 15px; }
.blk .k { font-size: 12px; font-weight: 700; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; height: 22px; display: flex; align-items: center; justify-content: center; margin-top: 2px; }
.blk .en { font-family: var(--f-word); font-size: 17px; line-height: 1.45; }
.blk .zh { color: var(--muted); font-size: 14px; }
/* etymology: roots as blocks, formula reads left to right */
.ety { background: var(--tint); border-radius: max(14px, calc(var(--card-r) - 14px)); padding: 14px 14px 13px; display: flex; flex-direction: column; gap: 11px; font-size: 14.5px; line-height: 1.7; }
.ety.plain { background: transparent; border: 1px solid var(--line); }
.ety .lab { display: flex; align-items: baseline; gap: 8px; font-size: 12.5px; font-weight: 700; color: var(--accent); letter-spacing: 1px; }
.ety .lab span { font-family: var(--f-display); font-weight: 700; font-size: 12px; letter-spacing: 2px; opacity: .55; }
.ety.plain .lab { color: var(--muted); }
.ety p { margin: 0; }
.ety .en { font-family: var(--f-word); font-size: 1.08em; }
.ety .rt { font-family: var(--f-word); font-weight: 700; color: var(--accent); font-size: 1.12em; }
.eq-wrap { display: flex; flex-direction: column; gap: 8px; }
.eq { display: flex; flex-wrap: wrap; align-items: stretch; gap: 6px; }
.eq .op { align-self: center; font-family: var(--f-word); font-size: 20px; color: var(--muted); line-height: 1; }
.chip-r { display: inline-flex; flex-direction: column; justify-content: center; background: var(--surface); border-radius: 12px; padding: 6px 11px 8px; min-width: 48px; position: relative; overflow: hidden; }
.chip-r::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: var(--r-tone); }
.chip-r b { font-family: var(--f-word); font-weight: 700; font-size: 22px; line-height: 1.1; color: var(--r-tone); }
.chip-r small { font-size: 12px; line-height: 1.35; color: var(--muted); margin-top: 1px; }
.t0 { --r-tone: var(--accent); }
.t1 { --r-tone: var(--accent-2); }
.chain { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 7px; color: var(--muted); font-size: 14px; }
.chain .arr { color: var(--accent); font-weight: 700; }
.chain .fin { color: var(--ink); font-weight: 700; font-size: 16.5px; }
.eq.inline { display: inline-flex; vertical-align: middle; gap: 4px; margin: 2px 0; }
.eq.inline .chip-r { padding: 2px 7px 4px; border-radius: 8px; min-width: 0; }
.eq.inline .chip-r b { font-size: 15px; }
.eq.inline .chip-r small { font-size: 10.5px; }
.eq.inline .op { font-size: 15px; }
.chain.inline { display: inline; }
.chain.inline > span { margin-right: 4px; }
.chain.inline .fin { font-size: 14.5px; }
/* roots marked inside the headword */
.hw .rs { display: inline-block; background: linear-gradient(var(--r-tone), var(--r-tone)) no-repeat 0 100% / calc(100% - 3px) 4px; padding-bottom: 9px; }
.hw:has(.rs) + .ipa { margin-top: 2px; }
.hw.tap { cursor: pointer; -webkit-tap-highlight-color: transparent; }
.cols { display: flex; flex-wrap: wrap; gap: 6px 14px; }
.cols span { font-size: 14.5px; }
.cols span b { font-family: var(--f-word); font-weight: 400; font-size: 16px; }
.cols span em { font-style: normal; color: var(--muted); }

.sbtn { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--tint); color: var(--accent); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; flex: none; }
.sbtn svg { width: 20px; height: 20px; }
.sbtn.sm { width: 30px; height: 30px; }
.sbtn.sm svg { width: 15px; height: 15px; }
.sbtns { display: flex; gap: 8px; }

/* the listen button */
.listen { position: relative; width: 132px; height: 132px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); cursor: pointer; margin: 8px auto; display: flex; align-items: center; justify-content: center; }
.listen svg { width: 54px; height: 54px; }
.listen::before, .listen::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--accent); opacity: 0; }
.listen.on::before { animation: ring 1.4s ease-out infinite; }
.listen.on::after { animation: ring 1.4s ease-out .5s infinite; }
@keyframes ring { from { transform: scale(1); opacity: .7; } to { transform: scale(1.55); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .listen.on::before, .listen.on::after { animation: none; } .prog i { transition: none; } }
.slow { display: block; margin: 0 auto; }

.q-prompt { text-align: center; display: flex; flex-direction: column; gap: 6px; align-items: center; }
.q-prompt .ask { font-size: 14px; color: var(--muted); letter-spacing: .5px; }
.q-prompt .big { font-size: 22px; font-weight: 600; }
.cloze { font-family: var(--f-word); font-size: 20px; line-height: 1.5; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
.cloze u { text-decoration: none; display: inline-block; min-width: 88px; border-bottom: 2px solid var(--accent); }
.opts { display: grid; gap: 10px; }
.opt { text-align: left; background: var(--surface); border: 1.5px solid var(--line); border-bottom-width: 3px; border-radius: 14px; padding: 13px 14px; cursor: pointer; font-size: 16px; display: flex; gap: 10px; align-items: center; }
.opt .key { font-family: var(--f-display); font-weight: 700; color: var(--muted); width: 18px; }
.opt.word { font-family: var(--f-word); font-size: 19px; }
.opt.sel { border-color: var(--accent); background: var(--tint); }
.opt.right { border-color: var(--good); background: var(--good-tint); }
.opt.wrong { border-color: var(--bad); background: var(--bad-tint); }
.opt[disabled] { cursor: default; }
.opt .reveal { font-family: var(--f-word); margin-left: auto; color: var(--muted); }
.fb { border-radius: 14px; padding: 12px 14px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.fb.ok { background: var(--good-tint); color: var(--good); }
.fb.no { background: var(--bad-tint); color: var(--bad); }
.foot { margin-top: auto; display: flex; flex-direction: column; gap: 10px; position: sticky; bottom: 0; padding: 10px 0 calc(8px + env(safe-area-inset-bottom)); background: linear-gradient(to top, var(--bg) 75%, transparent); }
.foot.static { position: static; background: none; }
.hero.unit h1 { font-size: 36px; line-height: 1.05; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* module path */
.path { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.node { background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; padding: 10px; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
.node .m { font-family: var(--f-display); font-weight: 700; font-size: 20px; line-height: 1; }
.node .w { font-family: var(--f-word); font-size: 14px; line-height: 1.35; color: var(--muted); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
.node .m small { font-family: var(--f-body); font-weight: 400; font-size: 12px; color: var(--muted); margin-left: 6px; }
.node.done .w { color: var(--ink); opacity: .7; }
.node.done { border-color: var(--good); }
.node.done .m { color: var(--good); }
.node.next { border-color: var(--accent); background: var(--tint); }
.wl { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.wl button.wrow { all: unset; box-sizing: border-box; display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 9px 12px; border-top: 1px solid var(--line); cursor: pointer; }
.wl button.wrow:first-child { border-top: 0; }
.wl button.wrow:focus-visible { outline: 3px solid var(--accent); }
.wrow .ww { font-family: var(--f-word); font-size: 18px; font-weight: 700; }
.wrow .wm { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wrow .wc { font-family: var(--f-display); font-weight: 700; color: var(--bad); }

/* reading */
.passage { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 20px 18px; display: flex; flex-direction: column; gap: 12px; }
.passage .eyebrow { font-family: var(--f-display); font-weight: 700; letter-spacing: 2px; font-size: 14px; color: var(--muted); }
.passage h2 { font-family: var(--f-word); font-size: 26px; line-height: 1.2; }
.passage .sub { font-family: var(--f-word); font-style: italic; color: var(--muted); font-size: 17px; }
.passage p { font-family: var(--f-word); font-size: 18px; line-height: 1.62; margin: 0; max-width: 65ch; }
.passage p .pl { font-family: var(--f-display); font-weight: 800; font-style: normal; margin-right: 8px; }
.passage mark { background: none; color: inherit; border-bottom: 2px solid var(--accent); cursor: pointer; padding: 0 1px; }
.passage mark:focus-visible { outline: 2px solid var(--accent); }
.qgroup { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.qgroup h3 { font-family: var(--f-display); font-weight: 700; font-size: 22px; }
.instr { font-family: var(--f-word); font-size: 16.5px; line-height: 1.5; }
.instr p { margin: 0 0 6px; }
.instr .ans-key { display: grid; grid-template-columns: auto 1fr; gap: 2px 14px; margin: 6px 0; }
.instr .ans-key b { font-weight: 700; }
.qi { display: grid; grid-template-columns: 30px 1fr; gap: 8px; align-items: start; font-family: var(--f-word); font-size: 17px; }
.qi .qn { font-family: var(--f-display); font-weight: 800; font-size: 20px; line-height: 1.2; }
.qi .choices { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; font-family: var(--f-body); }
.ch { border: 1.5px solid var(--line); background: var(--bg); border-radius: 10px; padding: 5px 10px; cursor: pointer; font-size: 14px; }
.ch.sel { border-color: var(--accent); background: var(--tint); }
.ch.right { border-color: var(--good); background: var(--good-tint); }
.ch.wrong { border-color: var(--bad); background: var(--bad-tint); }

function h(tag, attrs, ...kids) {

    if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);

}

/* ============================================================ schedule */
function dueReviews(t = today()) {
  const out = [];
  if (!META) return out;
  for (const u of META.units) {
    const L = P.data.learned[u.id]; if (!L) continue;
    const rv = P.data.rev[u.id] || {};
    for (let s = 1; s <= INTERVALS.length; s++) {
      if (rv[s]) continue;
      const prev = s === 1 ? L : rv[s - 1];
      let due = addDays(L, INTERVALS[s - 1]);
      const minDue = addDays(prev, 1);
      if (due < minDue) due = minDue;
      if (due <= t) out.push({ unit: u, stage: s, due, late: diffDays(t, due) });
      break;
    }
  }
  return out;
}
function nextReviewDate(uid) {
  const L = P.data.learned[uid]; if (!L) return null;
  const rv = P.data.rev[uid] || {};
  for (let s = 1; s <= INTERVALS.length; s++) {
    if (rv[s]) continue;
    const prev = s === 1 ? L : rv[s - 1];
    let due = addDays(L, INTERVALS[s - 1]);

}

const POS_RE = /\b(n|v|vt|vi|adj|adv|prep|conj|pron|num|abbr|int|interj|art|aux)\.\s*/g;

  POS_RE.lastIndex = 0;
  while ((mt = POS_RE.exec(s))) {
    if (mt.index > last) frag.push(s.slice(last, mt.index));
    frag.push(h('span', { class: 'pos' }, mt[1] + '.'));
    last = POS_RE.lastIndex;
  }

}
function shortMeaning(m, max = 26) {
  let s = String(m || '').replace(/\s+/g, ' ').trim();
  if (s.length > max) s = s.slice(0, max).replace(/[；;，,\s]+[^；;，,]*$/, '') + '…';
  return s;
}
function clozeOf(w) {
  const ex = (w.ex || []).find(e => e.en && e.en.length > 12);
  if (!ex) return null;
  const head = w.w.trim();
  let re;
  if (/\s/.test(head)) re = new RegExp('\\b' + head.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/\s+/g, '\\s+') + '\\b', 'i');
  else {
    const stem = head.length > 4 ? head.replace(/(e|y)$/i, '') : head;
    re = new RegExp('\\b' + stem.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '[a-z]*\\b', 'i');
  }
  const m = ex.en.match(re);
  if (!m) return null;
  return { before: ex.en.slice(0, m.index), hit: m[0], after: ex.en.slice(m.index + m[0].length), en: ex.en, zh: ex.zh };
}

/* ============================================================ etymology parsing */
function normNote(s) {
  return String(s || '')
    .replace(/→\s*[>)）]+/g, '→').replace(/->|＞|⟶|⇒/g, '→')
    .replace(/一\s*[)）](?=[一-鿿A-Za-z])/g, '→')
    .replace(/→(\s*→)+/g, '→').replace(/＋/g, '+');
}
const TERM_RE = /([A-Za-z][A-Za-z\-]{0,18})\s*[（(]\s*([^（）()]{1,26}?)\s*[）)]/g;
const FORM_RE = /(?:[A-Za-z][A-Za-z\-]{0,18}\s*[（(][^（）()]{1,26}[）)]\s*\+\s*)+[A-Za-z][A-Za-z\-]{0,18}\s*[（(][^（）()]{1,26}[）)](?:\s*→\s*[^→。！!\n]*)*/g;
function parseFormula(str) {
  const k = str.indexOf('→');
  const left = k >= 0 ? str.slice(0, k) : str;
  const terms = [];
  TERM_RE.lastIndex = 0;
  let m;
  while ((m = TERM_RE.exec(left))) terms.push({ r: m[1], m: m[2].trim() });
  const chain = k >= 0 ? str.slice(k).split('→').map(x => x.trim().replace(/[，,；;。]+$/, '')).filter(Boolean) : [];
  return { terms, chain };
}
/* Split a note into: an optional hero formula (one that opens the note or a line), and the rest as pieces. */
function parseNote(note) {
  const text = normNote(note).trim();
  const pieces = [];
  let hero = null, last = 0, m;
  FORM_RE.lastIndex = 0;
  while ((m = FORM_RE.exec(text))) {
    const before = text.slice(last, m.index);
    const f = parseFormula(m[0]);
    if (f.terms.length < 2) continue;
    const opensLine = !hero && (/^\s*$/.test(before) && last === 0 || /\n\s*$/.test(before));
    if (before) pieces.push({ t: 'text', s: before });
    if (opensLine) hero = f; else pieces.push({ t: 'eq', f });
    last = m.index + m[0].length;
  }
  if (last < text.length) pieces.push({ t: 'text', s: text.slice(last) });
  // trim leading punctuation left behind by the hero
  if (pieces.length && pieces[0].t === 'text') pieces[0].s = pieces[0].s.replace(/^[\s。．.，,；;]+/, '');
  const rest = pieces.filter(p => p.t !== 'text' || p.s.trim());
  const isEty = !!hero || rest.some(p => p.t === 'eq') || /字根|词根|前缀|后缀|源自|词源|来自/.test(text);
  return { hero, rest, isEty };
}
/* Find the formula's roots inside the headword, in order. Returns segments or null. */
function segmentHead(word, terms) {
  const lw = word.toLowerCase();
  let pos = 0, n = 0;
  const segs = [];
  for (const t of terms) {
    let r = t.r.toLowerCase().replace(/[^a-z]/g, '');
    if (!r) continue;
    let k = lw.indexOf(r, pos);
    if ((k < 0 || k - pos > 2) && r.length > 3) { r = r.slice(0, -1); k = lw.indexOf(r, pos); }
    if (k < 0 || k - pos > 2) return null;
    if (k > pos) segs.push({ s: word.slice(pos, k) });
    segs.push({ s: word.slice(k, k + r.length), tone: n % 2 });
    n++;
    pos = k + r.length;
  }
  if (lw.length - pos > 3) return null;
  if (pos < lw.length) segs.push({ s: word.slice(pos) });
  return n >= 2 ? segs : null;
}
function proseNodes(s) {
  const out = [];
  const re = /(字根|词根|前缀|后缀)\s*([A-Za-z][A-Za-z\-]*(?:\s*[\/／]\s*[A-Za-z][A-Za-z\-]*)*)|([A-Za-z][A-Za-z'’\-]*(?:[ ,.'’\-]+[A-Za-z][A-Za-z'’\-]*)*)|(\n)/g;
  let last = 0, m;
  while ((m = re.exec(s))) {
    if (m.index > last) out.push(s.slice(last, m.index));
    if (m[1]) out.push(m[1], h('b', { class: 'rt', lang: 'en' }, m[2]));
    else if (m[3]) out.push(h('span', { class: 'en', lang: 'en' }, m[3]));
    else out.push(h('br'));
    last = re.lastIndex;
  }
  if (last < s.length) out.push(s.slice(last));
  return out;
}
function eqNode(f, inline) {

    eq.append(h('span', { class: 'chip-r t' + (i % 2) }, h('b', { lang: 'en' }, t.r), h('small', null, t.m)));

  if (!f.chain.length) return eq;

  f.chain.forEach((c, i) => {
    chain.append(h('span', { class: 'arr', 'aria-hidden': 'true' }, '→'));
    chain.append(h('span', { class: i === f.chain.length - 1 ? 'fin' : 'step' }, proseNodes(c)));

}
function etyBlock(note) {
  const p = parseNote(note);

/* ============================================================ exercises */
function optionMeanings(word, pool, n = 4) {
  const own = shortMeaning(word.m);
  const posOf = w => (String(w.m).match(/^(\w+)\./) || [])[1];
  const p = posOf(word);
  let cands = pool.filter(x => x.id !== word.id && x.m && shortMeaning(x.m) !== own);
  const same = shuffle(cands.filter(x => posOf(x) === p));
  const rest = shuffle(cands.filter(x => posOf(x) !== p));
  const picked = [...same, ...rest].slice(0, n - 1);
  return shuffle([word, ...picked]);
}
function optionWords(word, pool, n = 4) {
  const cands = shuffle(pool.filter(x => x.id !== word.id && x.w.toLowerCase() !== word.w.toLowerCase()));
  return shuffle([word, ...cands.slice(0, n - 1)]);
}

    KEYS.handler = e => {
      const n = 'abcd'.indexOf(e.key.toLowerCase()); if (n >= 0 && n < opts.length) list.children[n].click();
      const k = parseInt(e.key, 10); if (k >= 1 && k <= opts.length) list.children[k - 1].click();
      if (e.key === 'Enter') confirm.click();
    };
    return () => {};
  },
};

/* Generic drill runner: queue of {type, word}; wrong answers come back at the end. */
function runDrill({ title, items, pool, onFinish, retry = true, unitTag }) {
  const queue = items.slice();
  const total = queue.length;
  let doneCount = 0, right = 0, wrongSet = new Set();
  const step = () => {
    if (!queue.length) { onFinish({ total, right, wrong: [...wrongSet] }); return; }
    const it = queue.shift();
    const inner = shell(title, doneCount / total, (doneCount + 1) + '/' + total);
    const box = h('div', { style: { display: 'flex', flexDirection: 'column', gap: '14px' } });
    inner.append(box);
    const foot = h('div', { class: 'foot' });
    inner.append(foot);
    const play = EX[it.type](box, it.word, pool, ok => {
      if (ok) { right++; doneCount++; }
      else {
        wrongSet.add(it.word.id); P.wrong(it.word.id);
        if (retry) queue.push({ type: it.type === 'meaningToSound' ? 'listenMeaning' : it.type, word: it.word, again: true, show: it.show });
        else doneCount++;
      }
      if (!ok) box.append(wordCard(it.word));
      const next = h('button', { class: 'btn block ' + (ok ? 'acc' : ''), onclick: step }, ok ? '继续' : '记住了，继续');
      foot.append(h('div', { class: 'fb ' + (ok ? 'ok' : 'no') }, ok ? '答对了' : '答错了，这个词会再出现一次', soundBtn(() => sayWord(it.word), '朗读', true)), next);
      if (ok) TTS.speak(speakable(it.word.w));
      KEYS.handler = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); step(); } };
      next.focus({ preventScroll: true });
    }, it);
    if (it.type !== 'meaningToSound' && P.settings().autoplay) play();
  };
  step();
}

/* ============================================================ learn a module */
async function startModule(u, mi) {
  TTS.unlock();
  const words = await loadUnit(u.id);
  const ids = u.modules[mi];
  const mw = ids.map(id => words.find(w => w.id === id)).filter(Boolean);
  openOverlay();
  runDeck(mw, () => practice());
  const practice = () => {
    const a = shuffle(mw).map((w, k) => ({ type: 'listenMeaning', word: w, show: k % 3 === 2 }));
    const b = shuffle(mw).map((w, k) => ({ type: clozeOf(w) && k % 2 === 0 ? 'clozeListen' : 'meaningToSound', word: w }));
    runDrill({
      title: '练习 · 以听为主', items: [...a, ...b], pool: words,
      onFinish: res => finish(res),
    });
  };
  function finish(res) {
    const m = modsOf(u).slice();
    while (m.length < u.modules.length) m.push(0);
    m[mi] = 1;
    P.data.mods[u.id] = m;
    P.markDay('m', u.id + ':' + mi);
    let unitDone = m.every(Boolean) && !P.data.learned[u.id];
    if (unitDone) { P.data.learned[u.id] = today(); P.markDay('n', u.id); }
    P.save();
    const acc = res.total ? Math.round(res.right / res.total * 100) : 100;
    const inner = shell('', 1, '');
    inner.append(h('div', { class: 'hero' },
      h('h1', null, unitDone ? '单元完成' : '模块 ' + (mi + 1) + ' 完成'),
      h('p', null, '首次正确率 ' + acc + '%' + (res.wrong.length ? '，有 ' + res.wrong.length + ' 个词进了难词本。' : '，全部一次答对。')),
      unitDone ? h('p', null, '明天复习这个单元，复习后会解锁一篇雅思风格的阅读。') : null));
    if (res.wrong.length) {
      const wl = h('div', { class: 'wl' });
      res.wrong.forEach(id => { const w = mw.find(x => x.id === id); if (w) wl.append(wordRow(w)); });
      inner.append(wl);
    }
    const nextMi = m.findIndex(x => !x);
    inner.append(h('div', { class: 'foot' },
      !unitDone && nextMi >= 0 ? h('button', { class: 'btn acc block', onclick: () => startModule(u, nextMi) }, '下一个模块 ' + (nextMi + 1)) : null,
      h('button', { class: 'btn ' + (unitDone || nextMi < 0 ? 'acc' : 'ghost') + ' block', onclick: closeOverlay }, '返回')));
    KEYS.handler = null;
  }
}

/* ============================================================ swipe deck */
const REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
function runDeck(mw, onDone) {
  const N = mw.length;
  let idx = 0, anim = false;
  const inner = shell('', 0, '1/' + N);
  OV.classList.add('deckmode');
  inner.classList.add('deck-in');
  const prevBtn = h('button', { class: 'link', type: 'button' }, '‹ 上一张');
  inner.append(h('div', { class: 'phase-row' }, h('span', { class: 'phase' }, '认识 · 听 → 跟读 → 上滑'), prevBtn));
  const stage = h('div', { class: 'stage' });
  inner.append(stage);
  const bar = inner.querySelector('.prog i'), cnt = inner.querySelector('.count');

  const make = k => {
    let c;
    if (k < N) c = wordCard(mw[k], { deck: true, hint: (k === N - 1 ? '上滑进入练习' : '上滑下一个') + (k > 0 ? ' · 下滑回上一个' : '') });
    else c = h('article', { class: 'card endcard' },
      h('span', { class: 'phase' }, 'MODULE CHECK'),
      h('div', { class: 'big' }, '听一听，', h('br'), h('b', null, '选一选')),
      h('p', null, '刚认识的 ' + N + ' 个词，接下来做 ' + (N * 2) + ' 道以听为主的题。不用拼写。'),
      swipeHint('上滑开始练习 · 下滑回上一个'));
    c.classList.add('dcard');
    return c;
  };
  const REST = 'translateY(26px) scale(0.92)';
  const ease = REDUCED ? 'none' : 'transform .38s cubic-bezier(.2,.8,.2,1), opacity .38s ease';
  const setT = (el, tr, op, trans) => { if (!el) return; el.style.transition = trans || 'none'; el.style.transform = tr; el.style.opacity = op; };
  let front = null, behind = null;
  const update = () => {
    const shown = Math.min(idx + 1, N);
    cnt.textContent = shown + '/' + N;
    bar.style.width = (Math.min(idx, N) / N * 100 / 3).toFixed(1) + '%';
    prevBtn.disabled = idx === 0;
  };
  const mount = () => {
    stage.textContent = '';
    front = make(idx);
    behind = idx + 1 <= N ? make(idx + 1) : null;
    if (behind) { behind.classList.add('behind'); setT(behind, REST, '0.5'); stage.append(behind); }
    stage.append(front);
    update();
  };
  const atBottom = el => el.scrollTop + el.clientHeight >= el.scrollHeight - 2;
  const OFF = () => -stage.clientHeight - 40;      // where the previous card waits, just above the stage
  let inc = null;                                    // previous card while it is being pulled down
  const dragUp = dy => {
    const H = stage.clientHeight;
    if (dy > 0) { setT(front, 'translateY(' + dy + 'px)', '1'); return; }
    const p = Math.min(1, -dy / (H * 0.55));
    setT(front, 'translateY(' + dy + 'px) scale(' + (1 - 0.04 * p) + ')', '1');
    if (behind) setT(behind, 'translateY(' + (26 * (1 - p)) + 'px) scale(' + (0.92 + 0.08 * p) + ')', String(0.5 + 0.5 * p));
  };
  const ensureInc = () => {
    if (!inc && idx > 0) {
      inc = make(idx - 1);
      inc.classList.add('incoming');
      setT(inc, 'translateY(' + OFF() + 'px)', '1');
      stage.append(inc);
    }
    return inc;
  };
  const dragDown = dy => {
    const H = stage.clientHeight;
    if (idx === 0) { setT(front, 'translateY(' + (dy * 0.22) + 'px)', '1'); return; }
    ensureInc();
    const p = Math.min(1, dy / (H * 0.6));
    setT(inc, 'translateY(' + Math.min(0, OFF() + dy * 1.15) + 'px)', '1');
    setT(front, 'translateY(' + (26 * p) + 'px) scale(' + (1 - 0.08 * p) + ')', String(1 - 0.5 * p));
  };
  const springBack = () => {
    const sp = REDUCED ? 'none' : 'transform .45s cubic-bezier(.3,1.45,.45,1), opacity .3s ease';
    setT(front, 'none', '1', sp);
    if (behind) setT(behind, REST, '0.5', sp);
    if (inc) {
      const el = inc; inc = null;
      setT(el, 'translateY(' + OFF() + 'px)', '1', REDUCED ? 'none' : 'transform .32s cubic-bezier(.4,0,.2,1)');
      after(el, () => el.remove());
    }
  };
  const after = (el, fn) => {
    let done = false;
    const go = () => { if (done) return; done = true; fn(); };
    el.addEventListener('transitionend', e => { if (e.target === el && e.propertyName === 'transform') go(); });
    setTimeout(go, REDUCED ? 30 : 460);
  };
  const next = () => {
    if (anim) return;
    if (idx >= N) {                       // the practice card goes away -> drill
      anim = true;
      setT(front, 'translateY(' + (-stage.clientHeight - 80) + 'px) scale(.96)', '0', ease);
      after(front, () => { anim = false; onDone(); });
      return;
    }
    anim = true;
    if (idx + 1 < N && P.settings().autoplay) sayWord(mw[idx + 1]); else TTS.stop();
    const H = stage.clientHeight;
    setT(front, 'translateY(' + (-H - 80) + 'px) scale(.96)', '0.6', ease);
    if (behind) setT(behind, 'none', '1', ease);
    const old = front;
    after(old, () => {
      old.remove();
      idx++;
      front = behind; front.classList.remove('behind'); setT(front, 'none', '1');
      behind = idx + 1 <= N ? make(idx + 1) : null;
      if (behind) { behind.classList.add('behind'); setT(behind, REST, '0'); stage.prepend(behind); requestAnimationFrame(() => setT(behind, REST, '0.5', 'opacity .3s ease')); }
      update();
      anim = false;
    });
  };
  const prev = () => {
    if (anim || idx === 0) return;
    anim = true;
    if (P.settings().autoplay) sayWord(mw[idx - 1]);
    const el = ensureInc();
    inc = null;
    el.getBoundingClientRect();
    setT(el, 'none', '1', ease);
    setT(front, REST, '0.5', ease);
    after(el, () => {
      if (behind) behind.remove();
      behind = front; behind.classList.add('behind');
      front = el; front.classList.remove('incoming');
      idx--;
      update();
      anim = false;
    });
  };
  prevBtn.addEventListener('click', prev);

  /* touch: up = next card (once scrolled to the end), down = previous card (once at the top) */
  let t0 = null, mode = null, lastY = 0, lastT = 0, vel = 0, startBottom = false, startTop = false;
  stage.addEventListener('touchstart', e => {
    if (anim || e.touches.length > 1) { t0 = null; return; }
    const t = e.touches[0];
    t0 = { x: t.clientX, y: t.clientY };
    lastY = t.clientY; lastT = e.timeStamp; vel = 0; mode = null;
    startBottom = atBottom(front); startTop = front.scrollTop <= 0;
  }, { passive: true });
  stage.addEventListener('touchmove', e => {
    if (!t0 || anim) return;
    const t = e.touches[0];
    const dy = t.clientY - t0.y, dx = t.clientX - t0.x;
    const dt = e.timeStamp - lastT;
    if (dt > 0) vel = 0.7 * ((t.clientY - lastY) / dt) + 0.3 * vel;
    lastY = t.clientY; lastT = e.timeStamp;
    if (!mode) {
      const wantUp = dy < 0 && startBottom, wantDown = dy > 0 && startTop;
      if (!wantUp && !wantDown) return;            // let the card scroll normally
      e.preventDefault();
      if (Math.abs(dy) < Math.abs(dx)) return;
      mode = wantUp ? 'up' : 'down';
    }
    e.preventDefault();
    if (mode === 'up') dragUp(dy < 0 ? dy : dy * 0.25);
    else dragDown(Math.max(0, dy));
  }, { passive: false });
  const end = () => {
    if (!t0) return;
    const m = mode, dy = lastY - t0.y, H = stage.clientHeight;
    t0 = null; mode = null;
    if (m === 'up') { if (dy < -H * 0.18 || vel < -0.45) next(); else springBack(); }
    else if (m === 'down') { if (idx > 0 && (dy > H * 0.18 || vel > 0.45)) prev(); else springBack(); }
  };
  stage.addEventListener('touchend', end);
  stage.addEventListener('touchcancel', () => { if (mode) springBack(); t0 = null; mode = null; });

  /* Mac trackpad / mouse wheel: scroll past the end of the card to turn it */
  let acc = 0, quietTimer = null, locked = false;
  stage.addEventListener('wheel', e => {
    clearTimeout(quietTimer);
    quietTimer = setTimeout(() => { acc = 0; locked = false; }, 160);
    if (anim || locked) { e.preventDefault(); return; }
    if (e.deltaY > 0 && atBottom(front)) {
      e.preventDefault(); acc += e.deltaY;
      if (acc > 110) { acc = 0; locked = true; next(); }
    } else if (e.deltaY < 0 && front.scrollTop <= 0 && idx > 0) {
      e.preventDefault(); acc += e.deltaY;
      if (acc < -110) { acc = 0; locked = true; prev(); }
    } else acc = 0;
  }, { passive: false });

  KEYS.handler = e => {
    if (e.key === ' ') { e.preventDefault(); if (idx < N) sayWord(mw[idx]); }
    if (['ArrowDown', 'ArrowRight', 'Enter', 'PageDown'].includes(e.key)) { e.preventDefault(); next(); }
    if (['ArrowUp', 'ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); prev(); }
  };
  mount();
  if (P.settings().autoplay) sayWord(mw[0]);
}

/* ============================================================ review (Ebbinghaus) */
async function startReview(u, stage, free = false) {
  const words = await loadUnit(u.id);
  openOverlay();
  const order = shuffle(words);
  const total = order.length;
  let i = 0, known = 0;
  const missed = [];
  const title = free ? '自由复习 · ' + unitLabel(u) : '第 ' + stage + ' 次复习 · ' + unitLabel(u);
  const step = () => {
    if (i >= total) return retryMissed();
    const w = order[i];
    const inner = shell(title, i / total, (i + 1) + '/' + total, async () => {
      if (await confirmBox('退出复习？', '本次复习还没完成，退出后需要重新开始。', '退出', '继续复习')) closeOverlay();
    });
    const lb = h('button', { class: 'listen', 'aria-label': '再听', onclick: () => play() });
    lb.innerHTML = ICON.play;
    const play = (slow) => { lb.classList.add('on'); TTS.speak(speakable(w.w), { rate: slow ? 0.6 : 1, onend: () => lb.classList.remove('on') }); };
    inner.append(h('div', { class: 'q-prompt' }, h('span', { class: 'ask' }, '先听，不看拼写：你想得起它的意思吗？'), lb,
      h('button', { class: 'link slow', onclick: () => play(true) }, '慢速再听')));
    const foot = h('div', { class: 'foot' });
    const reveal = (claimed) => {
      const card = wordCard(w);
      inner.insertBefore(card, foot);
      foot.textContent = '';
      if (claimed) {
        foot.append(h('div', { class: 'note' }, '对照一下，你想的意思对吗？'),
          h('div', { class: 'row2' },
            h('button', { class: 'btn ghost', onclick: () => { missed.push(w); P.wrong(w.id); i++; step(); } }, '记错了'),
            h('button', { class: 'btn acc', onclick: () => { known++; i++; step(); } }, '对了')));
        KEYS.handler = e => { if (e.key === 'ArrowRight' || e.key === 'Enter') { known++; i++; step(); } if (e.key === 'ArrowLeft') { missed.push(w); P.wrong(w.id); i++; step(); } };
      } else {
        missed.push(w); P.wrong(w.id);
        foot.append(h('button', { class: 'btn acc block', onclick: () => { i++; step(); } }, '跟读一遍，继续'));
        KEYS.handler = e => { if (e.key === 'Enter') { i++; step(); } };
      }
      card.scrollIntoView({ block: 'nearest' });
    };
    foot.append(h('div', { class: 'row2' },
      h('button', { class: 'btn ghost', onclick: () => reveal(false) }, '想不起来'),
      h('button', { class: 'btn acc', onclick: () => reveal(true) }, '想起来了')));
    inner.append(foot);
    KEYS.handler = e => {
      if (e.key === ' ') { e.preventDefault(); play(); }
      if (e.key === 'ArrowRight' || e.key === 'Enter') reveal(true);
      if (e.key === 'ArrowLeft') reveal(false);
    };
    if (P.settings().autoplay) play();
  };
  const retryMissed = () => {
    if (!missed.length) return finish({ total, right: total, wrong: [] });
    const inner = shell(title, 1, '');
    inner.append(h('div', { class: 'hero' }, h('h1', null, '再听一轮'), h('p', null, missed.length + ' 个没想起来的词，用听音选义再过一遍。')));
    inner.append(h('div', { class: 'foot' }, h('button', { class: 'btn acc block', onclick: () => {
      runDrill({ title: '回炉 · 听音选义', items: shuffle(missed).map(w => ({ type: 'listenMeaning', word: w })), pool: words, retry: true,
        onFinish: () => finish({ total, right: known, wrong: missed.map(w => w.id) }) });
    } }, '开始')));
  };
  const finish = (res) => {
    if (!free) {
      const rv = Object.assign({}, P.data.rev[u.id] || {});
      rv[stage] = today();
      P.data.rev[u.id] = rv;
      P.markDay('r', u.id + ':' + stage);
      P.save();
    }
    const inner = shell('', 1, '');
    const unlock = !free && stage === 1 && !P.data.read[u.id];
    inner.append(h('div', { class: 'hero' },
      h('h1', null, free ? '复习完成' : '第 ' + stage + ' 次复习完成'),
      h('p', null, '一听就想起来 ' + res.right + '/' + res.total + ' 个。' + (res.wrong.length ? res.wrong.length + ' 个已加入难词本。' : '')),
      !free && stage < INTERVALS.length ? h('p', null, '下一次复习：' + fmtDate(nextReviewDate(u.id).due) + '。') : null,
      unlock ? h('p', null, '这个单元的雅思阅读已解锁。') : null));
    inner.append(h('div', { class: 'foot' },
      unlock ? h('button', { class: 'btn acc block', onclick: () => openReading(u) }, '去做阅读') : null,
      h('button', { class: 'btn block ' + (unlock ? 'ghost' : 'acc'), onclick: closeOverlay }, '返回')));
    KEYS.handler = null;
  };
  step();
}
function fmtDate(s) {
  const d = diffDays(s, today());
  const wd = '日一二三四五六'[parseD(s).getDay()];
  const md = (parseD(s).getMonth() + 1) + '月' + parseD(s).getDate() + '日';
  if (d === 0) return '今天';
  if (d === 1) return '明天（' + md + '）';
  return md + ' 周' + wd;
}

/* ============================================================ IELTS reading */
const QTYPES = ['tfng', 'mcq', 'matching_info', 'sentence_completion', 'headings', 'ynng', 'summary_completion', 'matching_features', 'short_answer', 'sentence_endings', 'summary_box', 'notes_completion'];
const QT = {
  tfng: { name: 'TRUE / FALSE / NOT GIVEN', n: 5 },
  ynng: { name: 'YES / NO / NOT GIVEN', n: 5 },
  mcq: { name: 'Multiple choice', n: 3 },
  matching_info: { name: 'Matching information', n: 4 },
  headings: { name: 'Matching headings', n: 4 },
  matching_features: { name: 'Matching features', n: 4 },
  sentence_endings: { name: 'Matching sentence endings', n: 4 },
  sentence_completion: { name: 'Sentence completion', n: 4, limit: 'NO MORE THAN TWO WORDS', max: 2 },
  summary_completion: { name: 'Summary completion', n: 5, limit: 'ONE WORD ONLY', max: 1 },
  summary_box: { name: 'Summary completion (word list)', n: 5 },
  notes_completion: { name: 'Note completion', n: 5, limit: 'ONE WORD ONLY', max: 1 },
  short_answer: { name: 'Short-answer questions', n: 4, limit: 'NO MORE THAN THREE WORDS AND/OR A NUMBER', max: 3 },
};
function qtypeFor(u) { return QTYPES[(META.units.indexOf(u)) % QTYPES.length]; }
const ROMAN = ['i', 'ii', 'iii', 'iv', 'v', 'vi', 'vii', 'viii', 'ix', 'x'];
const LET = 'ABCDEFGHIJ';

function typeSpec(t) {
  const n = QT[t].n;
  switch (t) {
    case 'tfng': return `Question type: Identifying information (TRUE / FALSE / NOT GIVEN). Write exactly ${n} statements that test factual information in the passage, paraphrasing rather than copying it, in the same order as the information appears in the passage. Use each of TRUE, FALSE and NOT GIVEN at least once. A NOT GIVEN statement must be on-topic but impossible to verify from the passage.
"questions": {"items": [{"q": "statement", "answer": "TRUE" | "FALSE" | "NOT GIVEN", "explain": "中文解析"}]}`;
    case 'ynng': return `Question type: Identifying writer's views/claims (YES / NO / NOT GIVEN). The passage must clearly express the writer's own opinions and claims (an argumentative piece). Write exactly ${n} statements about the writer's views, in passage order, paraphrased. Use each of YES, NO and NOT GIVEN at least once.
"questions": {"items": [{"q": "statement", "answer": "YES" | "NO" | "NOT GIVEN", "explain": "中文解析"}]}`;
    case 'mcq': return `Question type: Multiple choice (one answer). Write exactly ${n} questions in passage order, each a question stem or an incomplete sentence with four options A–D. Exactly one option is correct; the distractors must be plausible and use words from the passage.
"questions": {"items": [{"q": "stem", "options": ["option A", "option B", "option C", "option D"], "answer": "A" | "B" | "C" | "D", "explain": "中文解析"}]}`;
    case 'matching_info': return `Question type: Matching information. The passage must have 5 or 6 paragraphs (they will be labelled A, B, C...). Write exactly ${n} items, each a noun phrase describing specific information located in one paragraph (e.g. "a reference to...", "an explanation of...", "an example of..."). Items must NOT follow passage order. One paragraph may be used twice; some paragraphs are not used.
"questions": {"items": [{"q": "a description of ...", "answer": "paragraph letter", "explain": "中文解析"}]}`;
    case 'headings': return `Question type: Matching headings. The passage must have exactly ${n} paragraphs (labelled A, B, C...). Write a list of ${n + 3} headings (short noun phrases, in random order) in which exactly ${n} fit one paragraph each and 3 are distractors that echo vocabulary from the passage but do not summarise any paragraph. Every paragraph is a question.
"questions": {"headings": ["heading", ...], "items": [{"para": "A", "answer": "roman numeral of the correct heading, e.g. iii", "explain": "中文解析"}]}`;
    case 'matching_features': return `Question type: Matching features. The passage must report the views or findings of exactly three named researchers (fictional but realistic names). Write exactly ${n} statements, each matching one researcher; at least one researcher is used twice. Statements do not follow passage order.
"questions": {"features_title": "List of Researchers", "features": ["Name 1", "Name 2", "Name 3"], "items": [{"q": "statement", "answer": "A" | "B" | "C", "explain": "中文解析"}]}`;

      }
    });
    if (!fromSaved) {

      h('div', { class: 'note', style: { maxWidth: '60%' } }, score === n ? '全对。' : '每道题下面有中文解析，对照原文再看一遍错题。')));
    check.remove();
    foot.prepend(h('button', { class: 'btn ghost block', onclick: async () => {
      if (await confirmBox('换一篇新文章？', '会重新生成文章和题目，当前这篇会被替换。', '换一篇')) {
        delete P.data.read[u.id]; P.save();
        try { await Store.putContent('rd_' + u.id, { unit: u.id, type: t, created: today(), data: null }); } catch (e) {}
        MEM.delete('rd_' + u.id); await IDB.set('rd_' + u.id, null);

      }

    if (!fromSaved) result.scrollIntoView({ behavior: 'smooth', block: 'center' });

  const foot = h('div', { class: 'foot static' }, check, h('button', { class: 'btn ghost block', onclick: closeOverlay }, '返回'));

function mergeProgress(a, b) {
  const out = JSON.parse(JSON.stringify(a));
  const early = (x, y) => !x ? y : !y ? x : (x < y ? x : y);
  for (const [u, d] of Object.entries(b.learned || {})) out.learned[u] = early(out.learned[u], d);
  for (const [u, m] of Object.entries(b.mods || {})) {
    const cur = out.mods[u] || [];
    out.mods[u] = Array.from({ length: Math.max(cur.length, m.length) }, (_, i) => (cur[i] || m[i]) ? 1 : 0);
  }
  for (const [u, r] of Object.entries(b.rev || {})) {
    const cur = Object.assign({}, out.rev[u] || {});
    for (const [st, d] of Object.entries(r)) cur[st] = early(cur[st], d);
    out.rev[u] = cur;
  }
  for (const [u, r] of Object.entries(b.read || {})) { const cur = out.read[u]; if (!cur || (r && r.date > cur.date)) out.read[u] = r; }
  for (const [w, n] of Object.entries(b.weak || {})) out.weak[w] = Math.max(out.weak[w] || 0, n);
  for (const [d, v] of Object.entries(b.days || {})) {
    const cur = Object.assign({}, out.days[d] || {});
    if (v.n && !cur.n) cur.n = v.n;
    for (const k of ['r', 'm', 'rd']) if (v[k]) cur[k] = [...new Set([...(cur[k] || []), ...v[k]])];
    out.days[d] = cur;
  }
  return out;
}
async function exportProgress() {
  const readings = {};
  if (META) for (const u of META.units) {
    if (!(P.data.rev[u.id] || {})[1]) continue;
    const d = await Store.getContent('rd_' + u.id).catch(() => null) || await IDB.get('rd_' + u.id);
    if (d && d.data) readings[u.id] = d;
  }
  return JSON.stringify({ 'zhenjing-progress': 1, exported: new Date().toISOString(), progress: P.data, readings });
}
async function importProgress(text) {
  const i = text.indexOf('{'), j = text.lastIndexOf('}');
  const obj = JSON.parse(text.slice(i, j + 1));
  if (!obj || obj['zhenjing-progress'] !== 1 || !obj.progress) throw new Error('这不是进度数据');
  const settings = P.data.settings;
  P.data = Object.assign(P.blank(), mergeProgress(Object.assign(P.blank(), P.data), Object.assign(P.blank(), obj.progress)));
  P.data.settings = settings;
  await P.flush();
  for (const [uid, doc] of Object.entries(obj.readings || {})) {
    const have = await Store.getContent('rd_' + uid).catch(() => null) || await IDB.get('rd_' + uid);
    if (!have || !have.data) { try { await Store.putContent('rd_' + uid, doc); } catch (e) { await IDB.set('rd_' + uid, doc); } }
  }
}

      h('div', { class: 'note' }, Store.mode === 'cloud' ? '词库和进度保存在你自己账号下的私有空间，iPhone 和 Mac 打开同一个链接会自动同步；别人打开这个链接看不到。' : '当前只保存在这台设备的浏览器里。在 claude.ai 或 Claude App 登录后打开本页，可以跨设备同步。'),
      h('div', { class: 'row2' },
        h('button', { class: 'btn ghost', onclick: () => importFlow(true) }, '重新导入词库'),
        h('button', { class: 'btn ghost', onclick: async () => {
          if (await confirmBox('清空学习进度？', '复习记录、阅读成绩和难词本都会被清除，词库保留。', '清空')) {
            P.data = Object.assign(P.blank(), { settings: P.data.settings }); await P.flush(); toast('进度已清空'); route();
          }
        } }, '清空进度'))));
  wrap.append(h('div', { class: 'sec-h' }, h('h2', null, '在设备和版本之间搬进度')),
    h('div', { class: 'set' },
      h('div', { class: 'note' }, window.OFFLINE_EDITION
        ? '离线版的进度只存在这台设备上。想和在线版（或另一台设备）同步：一边点「复制进度」，把文字发到另一边，再点「粘贴并合并」。'
        : '在线版在你的 iPhone 和 Mac 之间自动同步。要和离线版互通：一边点「复制进度」，把文字发到另一边，再点「粘贴并合并」。'),
      h('div', { class: 'row2' },
        h('button', { class: 'btn ghost', onclick: async () => copyText(await exportProgress(), '进度已复制') }, '复制进度'),
        h('button', { class: 'btn ghost', onclick: pasteProgressDialog }, '粘贴并合并'))));
  wrap.append(h('div', { class: 'sec-h' }, h('h2', null, 'Mac 键盘')),
    h('div', { class: 'set note' }, '空格：再听一遍　1–4 / A–D：选择　回车：继续　← →：想不起来 / 想起来了'));
  return wrap;
}

/* ============================================================ import */
function exampleWord() {
  return { id: 'demo', w: 'resonance', ipa: 'ˈrezənəns', m: 'n. 共鸣；回响；（声音的）洪亮',
    note: 're（再，回）+ son（声音）+ ance（名词后缀）→ 声音一再回荡 → 共鸣。同根词：sonic（声音的），sonata（奏鸣曲）。',
    ex: [{ en: 'A trained baritone uses the resonance of his chest and head to fill the hall.', zh: '受过训练的男中音会利用胸腔和头腔的共鸣来充满整个大厅。' }],
    col: [['vocal resonance', '声音共鸣'], ['emotional resonance', '情感共鸣']], rel: ['resonant adj. 洪亮的；引起共鸣的'] };
}
function pageWelcome(err) {
  const wrap = h('main', { class: 'wrap' });
  wrap.append(h('div', { class: 'hero' },
    h('h1', null, '雅思', h('b', null, '真经'), h('br'), '听读'),
    h('p', null, '一天一个单元。每个词先听、再跟读，练习以听为主；按艾宾浩斯节奏每天复习，前一天的单元复习完，会用它的词出一篇雅思阅读和一组真题题型。')));
  wrap.append(importBox(err));
  wrap.append(h('div', { class: 'sec-h' }, h('h2', null, '单词卡长这样'), h('span', { class: 'sample-tag' }, '示例词，不来自词库')));
  wrap.append(wordCard(exampleWord()));
  return wrap;
}
function importBox(err) {
  const file = h('input', { type: 'file', id: 'importfile', accept: '.json,application/json', class: 'sr' });
  const status = h('div', { class: 'note' }, '选择我发给你的词库文件（zhenjing-vocab.json）。导入一次即可，之后在 iPhone 和 Mac 上打开都能用。');
  const box = h('div', { class: 'drop' },
    h('b', null, '导入词库'), status,
    err ? h('div', { class: 'fb no' }, err) : null,
    h('label', { class: 'btn acc', for: 'importfile', role: 'button', tabindex: '0' }, '选择文件'), file);
  box.querySelector('label').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); file.click(); } });
  const handle = async f => {
    if (!f) return;
    status.textContent = '正在读取 ' + f.name + '…';
    try {
      const data = JSON.parse(await f.text());
      await doImport(data, msg => { status.textContent = msg; });
      toast('导入完成');
      if (OV) { OV.remove(); OV = null; document.body.style.overflow = ''; KEYS.handler = null; }
      await boot();
    } catch (e) {
      console.error(e);
      status.textContent = '导入失败：' + (e && (e.userMsg || e.message) || '文件格式不对') + '。';
    }
  };
  file.addEventListener('change', () => handle(file.files[0]));
  box.addEventListener('dragover', e => { e.preventDefault(); box.classList.add('over'); });
  box.addEventListener('dragleave', () => box.classList.remove('over'));
  box.addEventListener('drop', e => { e.preventDefault(); box.classList.remove('over'); handle(e.dataTransfer.files[0]); });
  return box;
}
async function doImport(data, report) {
  if (!data || data.format !== 'zhenjing-vocab/1' || !Array.isArray(data.units) || !data.words) throw { userMsg: '这不是本程序的词库文件' };
  const imgs = data.images || {};
  const meta = { format: data.format, title: data.title, chapters: data.chapters, units: data.units, imported: today() };
  const unitDocs = data.units.map(u => ({ key: 'u_' + u.id, val: { words: u.words.map(id => data.words[id]).filter(Boolean) } }));
  const imgDocs = Object.entries(imgs).map(([id, d]) => ({ key: 'img_' + id, val: { d } }));
  const all = [...unitDocs, ...imgDocs];
  let k = 0;
  for (const it of all) {
    await Store.putContent(it.key, it.val);
    k++;
    if (k % 3 === 0 || k === all.length) report('正在保存 ' + k + '/' + all.length + (Store.mode === 'cloud' ? '（上传到你的私有空间）' : ''));
  }
  /* the grouping may change between word-list versions: a new module counts as done
     when every one of its words was in a module you had already finished */
  if (META && P.data) {
    let changed = false;
    for (const nu of data.units) {
      const ou = META.units.find(x => x.id === nu.id);
      const om = P.data.mods[nu.id];
      if (!ou || !Array.isArray(om) || JSON.stringify(ou.modules) === JSON.stringify(nu.modules)) continue;
      const done = new Set();
      ou.modules.forEach((ids, i) => { if (om[i]) ids.forEach(id => done.add(id)); });
      P.data.mods[nu.id] = nu.modules.map(ids => (P.data.learned[nu.id] || ids.every(id => done.has(id))) ? 1 : 0);
      changed = true;
    }
    if (changed) await P.flush();
  }
  await Store.putContent('meta', meta);
  MEM.clear(); UNIT_CACHE.clear(); IMG_CACHE.clear();
}
async function importFlow() {
  openOverlay();
  const inner = shell('', 0, '', () => closeOverlay());
  inner.querySelector('.prog').style.visibility = 'hidden';
  inner.append(h('div', { class: 'hero' }, h('h1', null, '重新导入'), h('p', null, '用新的词库文件覆盖现有词库，学习进度保留。')), importBox());
}

/* ============================================================ router / boot */
function route() {
  if (OV) return;
  if (!META) return;
  const hsh = (location.hash || '#today').slice(1);
  const name = ['today', 'units', 'weak', 'settings'].includes(hsh) ? hsh : 'today';
  document.querySelectorAll('.nav a').forEach(a => a.classList.toggle('on', a.id === 'nav-' + name));
  const render = { today: pageToday, units: pageUnits, weak: pageWeak, settings: pageSettings }[name];
  Promise.resolve(render()).then(el => { $app.textContent = ''; $app.append(el); });
}
window.addEventListener('hashchange', route);
/* Make cards concentric with the iPhone's rounded display corners. */
function fitCorners() {
  const ua = navigator.userAgent || '';
  const root = document.documentElement.style;
  const iPhone = /iPhone/.test(ua);
  const iPad = /iPad/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  let R = 0;
  if (iPhone) {
    const w = Math.min(screen.width, screen.height), hh = Math.max(screen.width, screen.height);
    const dpr = window.devicePixelRatio || 2;
    const table = {
      '375x812': 39, '414x896': dpr >= 3 ? 39 : 41.5, '360x780': 44, '390x844': 47.33, '428x926': 53.33,
      '393x852': 55, '430x932': 55, '402x874': 62, '440x956': 62, '420x912': 62,
    };
    R = table[w + 'x' + hh] || (hh >= 800 ? 55 : 0);
  } else if (iPad) R = 18;
  if (R) {
    const inset = iPhone ? 10 : 16;
    root.setProperty('--screen-r', R + 'px');
    root.setProperty('--inset', inset + 'px');
    root.setProperty('--card-r', Math.max(18, R - inset) + 'px');
  }
}
fitCorners();
async function boot() {
  $app.textContent = '';
  $app.append(h('main', { class: 'wrap' }, header(), h('div', { class: 'empty' }, '正在打开词库…')));
  if (!Store.ready) await Store.init();
  await P.load();
  TTS.init();
  await loadMeta().catch(() => null);
  const nav = document.getElementById('nav');
  if (!META) { nav.hidden = true; $app.textContent = ''; $app.append(pageWelcome()); return; }
  nav.hidden = false;
  P.listeners = [() => { if (!OV) route(); }];
  route();
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && P.dirty) P.flush(); else if (document.visibilityState === 'visible' && !OV && META) route(); });
boot();
